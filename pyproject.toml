[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "roi_rectangle"
version = "1.1.0"
description = "A module for handling rectangular regions of interest (ROI) in images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.8"
dependencies = ["numpy>=1.21"]
keywords = ["roi", "region of interest", "rectangle", "image", "numpy", "crop", "slice"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/roi_rectangle"
Repository = "https://github.com/NaNIsaac/roi_rectangle"
Issues = "https://github.com/NaNIsaac/roi_rectangle/issues"
Changelog = "https://github.com/NaNIsaac/roi_rectangle/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=7; python_version < '3.10'",
    # 9.0.3 fixes the tmpdir handling advisory and needs Python 3.10
    "pytest>=9.0.3; python_version >= '3.10'",
]

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"docs/conf.py" = ["I001"]
"tests/test_roi_rectangle.py" = ["C408", "I001"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
